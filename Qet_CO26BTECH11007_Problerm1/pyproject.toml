[project]
name = "statevector-simulator"
version = "0.1.0"
description = "A basic quantum statevector simulator implemented using NumPy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"